<!doctype html><html lang="en"><head>

<script src="/js/marvel-loader.js?v=1"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications - Marvel Nums</title><style>*{box-sizing:border-box}body{margin:0;background:#ffffff;color:#060d2b;font-family:system-ui,sans-serif}.top{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #dbe6f6}.top a{color:#00b4ff;text-decoration:none;font-weight:700;font-size:14px}.wrap{max-width:560px;margin:0 auto;padding:16px}.card{border:1px solid #dbe6f6;border-radius:14px;background:rgba(255,255,255,.03);padding:16px;margin-bottom:12px}.card h3{margin:0 0 8px;font-size:15px}.card p{margin:0;font-size:13.5px;line-height:1.6;opacity:.85}</style><link rel="stylesheet" href="/css/mvn-ui-fixes.css?v=20261022c">

<style>.card ul{margin:8px 0 0;padding-left:18px;font-size:13.5px;line-height:1.6;opacity:.85}.n-item{display:block;text-decoration:none;color:inherit}.n-item.unread{border-color:#00b4ff}.n-item small{display:block;margin-top:6px;opacity:.6;font-size:12px}.n-empty{text-align:center;opacity:.7;font-size:14px;padding:30px 10px}</style></head><body class="mvn-std"><div class="top"><a href="/dashboard">&lsaquo; Back</a><b>Notifications</b></div><div class="wrap"><div id="nList"><div class="n-empty">Loading...</div></div></div><script>
(function(){
var list=document.getElementById('nList');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});}
function safeLink(l){return typeof l==='string'&&l.charAt(0)==='/'&&l.charAt(1)!=='/'&&l!=='/notifications'?l:'';}
var token='';try{token=localStorage.getItem('mvn_token')||'';}catch(e){}
if(!token){location.replace('/login');return;}
var H={Authorization:'Bearer '+token};
fetch('/api/user/notifications',{headers:H,cache:'no-store'}).then(function(r){if(r.status===401){location.replace('/login');throw 0;}return r.json();}).then(function(d){
var items=(d&&d.items)||[];
if(!items.length){list.innerHTML='<div class="n-empty">You have no notifications yet.</div>';return;}
list.innerHTML=items.map(function(i){var l=safeLink(i.link);var t=i.createdAt?new Date(i.createdAt).toLocaleString():'';
return '<'+(l?'a href="'+esc(l)+'"':'div')+' class="card n-item'+(i.unread?' unread':'')+'"><h3>'+esc(i.title||'Notification')+'</h3><p>'+esc(i.message||i.description||'')+'</p><small>'+esc(t)+'</small></'+(l?'a':'div')+'>';}).join('');
fetch('/api/user/notifications/mark-seen',{method:'POST',headers:H}).catch(function(){});
}).catch(function(e){if(e!==0)list.innerHTML='<div class="n-empty">Could not load notifications. Please try again.</div>';});
})();
</script><script src="/js/loader-failsafe.js?v=1" defer></script>
<script src="/js/marvel-smooth.js?v=1" defer></script>

</body></html>
